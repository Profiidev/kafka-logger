name: Checks and Validation
on:
  pull_request:

jobs:
  build_and_test:
    name: Build and Test
    strategy:
      matrix:
        os:
          [
            { name: linux, os: ubuntu-latest },
            { name: macos, os: macos-latest },
          ]
    runs-on: ${{ matrix.os.os }}
    steps:
      - name: Prepare symlink configuration
        if: ${{ matrix.os.name == 'windows' }}
        run: git config --global core.symlinks true

      - run: choco install ninja
        if: ${{ matrix.os.name == 'windows' }}

      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
          components: clippy,rustfmt

      - name: Cache cargo and rust files
        id: rust_cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          shared-key: "build_and_test_${{ matrix.os.name }}"

      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-nextest
      - name: "Build and test"
        run: cargo nextest run --workspace --all-features --profile ${{ matrix.os.name }}

      - name: Upload Test Result File
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os.name }}
          path: ${{ github.workspace }}/target/nextest/${{ matrix.os.name }}/junit-${{ matrix.os.name }}.xml
          retention-days: 5

  comment_results:
    permissions:
      checks: write
      pull-requests: write
    name: Comment Results to PR
    runs-on: ubuntu-latest
    needs:
      - build_and_test
    steps:
      - name: Download Test Results
        uses: actions/download-artifact@v5
        with:
          pattern: test-results-*
          merge-multiple: true
          path: test-results
      - name: Publish Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: |
            test-results/**/*.xml

  linters:
    name: Run linters
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      checks: write
      contents: write
    steps:
      - uses: profiidev/gluon@d715c4a8bd804db764307ad041e73c1c60ec7382 # v0
        id: app-token
        if: github.event.pull_request.head.repo.full_name == github.repository
        with:
          url: https://gluon.profidev.io
          profile: lint
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
          components: clippy,rustfmt

      - name: Cache cargo and rust files
        id: rust_cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          shared-key: "build_and_test_linux"

      - name: Run linters
        uses: profiidev/rust-lint-action@v3
        with:
          rustfmt: true
          clippy: true
          auto_fix: true
          github_token: ${{ steps.app-token.outputs.token || github.token }}
